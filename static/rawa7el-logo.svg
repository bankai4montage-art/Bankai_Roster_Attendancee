<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 72" width="280" height="72" role="img" aria-label="Rawa7el powered by Bankai">
  <defs>
    <linearGradient id="rawa7el-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="rawa7el-gradient-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a78bfa"/>
      <stop offset="50%" stop-color="#c084fc"/>
      <stop offset="100%" stop-color="#f472b6"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <mask id="text-mask">
      <rect x="0" y="0" width="280" height="72" fill="white"/>
    </mask>
  </defs>
  
  <!-- Main logo icon - stylized path/road symbol -->
  <g transform="translate(8, 8)">
    <path d="M24 56 Q12 28 24 0 Q36 28 24 56" fill="none" stroke="url(#rawa7el-gradient)" stroke-width="3" stroke-linecap="round" opacity="0.3"/>
    <circle cx="24" cy="28" r="4" fill="url(#rawa7el-gradient)"/>
  </g>
  
  <!-- "Rawa7el" main text -->
  <text x="56" y="42" font-family="'Alexandria', 'Cairo', 'Tajawal', 'Segoe UI', sans-serif" font-size="32" font-weight="800" fill="url(#rawa7el-gradient)" letter-spacing="0.5px" filter="url(#glow)">
    Rawa7el
  </text>
  
  <!-- "powered by Bankai" subtitle -->
  <text x="56" y="58" font-family="'Alexandria', 'Cairo', 'Tajawal', 'Segoe UI', sans-serif" font-size="11" font-weight="600" fill="#6b7280" letter-spacing="0.8px" opacity="0.85">
    powered by Bankai
  </text>
  
  <!-- Small accent dot -->
  <circle cx="172" cy="56" r="2.5" fill="#ec4899" opacity="0.7"/>
</svg>